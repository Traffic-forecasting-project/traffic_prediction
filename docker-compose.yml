version: "3.9"

services:
  ## ===========================================================
  ## MAIN SERVICE: Airflow (orchestrator and scheduler)
  ## ===========================================================
  airflow:
    build:
      context: ./Services/Airflow                ## Build context for Airflow image
      dockerfile: Dockerfile                     ## Dockerfile location
      args:
        APP_INPUTDIR: ${APP_INPUTDIR:-${PWD:-%cd%}}  ## Default build argument for input directory

    container_name: airflow                      ## Container name
    user: "0:0"                                  ## Run as root (needed for WSL file access)

    environment:
      - APP_INPUTDIR=${APP_INPUTDIR:-${PWD:-%cd%}}  ## Input directory variable
      - DATA_PATH=data                              ## Path for data inside container
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor   ## SequentialExecutor for simplicity
      - AIRFLOW__CORE__LOAD_EXAMPLES=False           ## Disable example DAGs
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags ## DAG folder path
      - AIRFLOW__CORE__BASE_LOG_FOLDER=/opt/airflow/logs  ## Log folder path
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db  ## SQLite database
      - PYTHONPATH=/opt/airflow                     ## Add Airflow directory to PYTHONPATH
      - _AIRFLOW_WWW_WORKERS=2                      ## Number of Gunicorn workers
      - _AIRFLOW_WEBSERVER_STARTUP_TIMEOUT=300      ## Webserver startup timeout
      - HOST_ROOT=${HOST_ROOT:-${PWD}}              ## Absolut path of the code folder
    volumes:
      - ./dags:/opt/airflow/dags           ## Mount DAGs
      - ./logs:/opt/airflow/logs           ## Mount logs
      - ./Services:/opt/airflow/Services   ## Mount shared service code
      - ./data:/opt/airflow/data           ## Mount data directory (critical for data access)
      - ./model:/opt/airflow/model         ## Mount model directory
      - /var/run/docker.sock:/var/run/docker.sock  ## Docker socket (optional for DockerOperator)

    ports:
      - "8082:8080"                        ## Map web UI to localhost:8082

    command: >
      bash -c "
        airflow db init &&  ## Initialize Airflow database
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin &&  ## Create default admin user
        exec airflow webserver &  ## Start Airflow webserver
        exec airflow scheduler     ## Start Airflow scheduler
      "

    restart: unless-stopped                ## Auto-restart unless manually stopped

  ## ===========================================================
  ## SERVICE: Data Collector
  ## ===========================================================
  data_collector:
    build:
      context: .                            ## Root context
      dockerfile: Services/DataCollection/Dockerfile
      args:
        APP_INPUTDIR: ${APP_INPUTDIR:-${PWD:-%cd%}}

    image: data_collector:latest            ## Image name
    container_name: data_collector          ## Container name

    volumes:
      - ./Services/DataCollection:/opt/airflow/Services/DataCollection  ## Mount service code
      - ./data:/opt/airflow/data                                       ## Share data with Airflow

    environment:
      - APP_INPUTDIR=${APP_INPUTDIR:-${PWD:-%cd%}}
      - HOST_ROOT=${HOST_ROOT:-${PWD}}              ## Absolut path of the code folder

    command: tail -f /dev/null             ## Keep container alive for debugging

  ## ===========================================================
  ## SERVICE: Data Preparation
  ## ===========================================================
  data_preparation:
    build:
      context: .                            ## Root context
      dockerfile: Services/DataPreparation/Dockerfile
      args:
        APP_INPUTDIR: ${APP_INPUTDIR:-${PWD:-%cd%}}

    image: data_preparation:latest          ## Image name
    container_name: data_preparation        ## Container name

    volumes:
      - .:/opt/airflow                      ## Mount full project
      - ./data:/opt/airflow/data            ## Share data folder

    command: tail -f /dev/null              ## Keep container running for manual execution

  ## ===========================================================
  ## SERVICE: Model Training
  ## ===========================================================
  model_training:
    build:
      context: .                            ## Root context
      dockerfile: Services/ModelTraining/Dockerfile
      args:
        APP_INPUTDIR: ${APP_INPUTDIR:-${PWD:-%cd%}}

    env_file:
    - .env
    image: model_training:latest            ## Image name
    container_name: model_training          ## Container name

    volumes:
      - .:/opt/airflow                      ## Mount full project
      - ./data:/opt/airflow/data            ## Share data folder

    command: tail -f /dev/null              ## Keep container idle

  

  ## ===========================================================
  ## SERVICE: Prometheus (Monitoring)
  ## ===========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml  # Fichier de config
      # - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    ports:
      - "9090:9090"
    networks:
      - default

  ## ===========================================================
  ## SERVICE: Node Exporter (Host Metrics)
  ## ===========================================================
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"
    networks:
      - default

  ## ===========================================================
  ## SERVICE: cAdvisor (Container Metrics)
  ## ===========================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - default

  ## ===========================================================
  ## SERVICE: Grafana (Dashboard Visualization)
  ## ===========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "0:0" # root temporairement
    entrypoint: >
      sh -c "chown -R 472:472 /var/lib/grafana && exec grafana-server"
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - default



## ===========================================================
  ## SERVICE: FastAPI (JWT/RBAC prediction API)
  ## ===========================================================
  api:
    build:
      context: ./Services/FastAPI
      dockerfile: Dockerfile
    image: fastapi_service:latest
    container_name: fastapi_api

    env_file:
      - .env          
    environment:
      - APP_PORT=8000   
      - PYTHONPATH=/app

    volumes:
      - ./Services/FastAPI/src:/app/src:rw
      - ./model:/app/model:rw
      - ./metrics:/app/metrics:rw
      - ./resources:/app/resources:rw

    ports:
      - "8000:8000"
    restart: unless-stopped

## ===========================================================
## NETWORK CONFIGURATION
## ===========================================================
networks:
  default:
    name: airflow_network                   ## Shared network for all services

## ===========================================================
## PERSISTENT VOLUMES
## ===========================================================
volumes:
  airflow_db:                               ## Persistent volume for Airflow SQLite database
