version: '3.8'

services:
  data_collector:
    build:
      context: ./Services/DataCollection
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./:/workspace:rw
    networks:
      - net
    profiles:
      - collector
    restart: unless-stopped
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
    tty: true
    stdin_open: true
    command: ["tail", "-f", "/dev/null"]
    # command: ["python", "-u", "Services/DataCollection/src/live_data_collector.py", "-a", "15", "-s", "incident_analysis"]

  fast_api:
    build:
      context: ./Services/FastAPI
      dockerfile: Dockerfile
    environment:
      APP_PORT: "8000"
      MODEL_PATH: "/app/model/model_incident_analysis_incident_duration_min.joblib"
      JWT_SECRET: "change-me"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      LOG_LEVEL: "info"
    volumes:
      - ./model:/app/model:ro
      - ./metrics:/app/metrics:ro
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - net
    restart: unless-stopped
    profiles:
      - api
    env_file:
      - ./.env
    working_dir: /app
    # command: uvicorn src.service:app --host 0.0.0.0 --port 8000 
    # python Services.FastAPI.src.service 
    # command: ["python", "-u", "src/service.py"]
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen(''http://localhost:8000/healthcheck'', timeout=2).status < 400 else sys.exit(1)"']
      interval: 600s  #10 minutes
      timeout: 3s
      retries: 10
      start_period: 5s
    tty: true
    stdin_open: true
    

  data_preparation:
    build:
      context: ./Services/DataPreparation
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./:/workspace:rw
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
    networks:
      - net
    profiles:
      - prep
    restart: "no"
    tty: true
    stdin_open: true
    #Add input param to run_prepare_data_pipeline function
    # command: ["python", "-u", "Services/DataPreparation/src/prepare_data.py", "--strategy", "incident_analysis", "--input", "DataCollection/data/raw/"]
    
    # Dont run any command
    command: ["tail", "-f", "/dev/null"]

  airflow:
    build:
      context: ./Services/Airflow
      dockerfile: Dockerfile
    env_file:
      - ./.env
    user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
    environment:
      - AIRFLOW__CORE__BASE_LOG_FOLDER=/opt/airflow/logs
      - AIRFLOW__LOGGING__BASE_LOG_FOLDER=/opt/airflow/logs
      - AIRFLOW__CORE__REMOTE_LOGGING=False
      - AIRFLOW__LOGGING__REMOTE_LOGGING=False
      - AIRFLOW__WEBSERVER__WEB_SERVER_HOST=0.0.0.0
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - PYTHONPATH=/opt/airflow:/opt/airflow/Services:/opt/airflow/src:/opt/airflow/project:${PYTHONPATH}
    volumes:
      - ./Services/Airflow/dags:/opt/airflow/dags:rw
      - ./Services:/opt/airflow/Services:rw
      - ./Services/DataCollection/data:/opt/airflow/Services/DataCollection/data:rw
      - ./src:/opt/airflow/src:rw
      - ./data:/opt/airflow/data:rw
      - ./Services/Airflow/logs:/opt/airflow/logs:rw
    ports:
      - "8080:8080"
    networks:
      - net
    restart: unless-stopped
    profiles:
      - airflow
    command: ["standalone"]

networks:
  net: