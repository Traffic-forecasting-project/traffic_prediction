name: CI, tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches-ignore: [ "main" ]   # run on all pushes except main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
          pip install pytest

      - name: Run pytest
        env:
          TESTING: "1"
        run: pytest -q
