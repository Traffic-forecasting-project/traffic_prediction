groups:
  - name: container-alerts
    rules:
      - alert: HighContainerCPUUsage
        expr: sum by (name) (rate(container_cpu_usage_seconds_total[1m])) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on container {{ $labels.name }}"
          description: "Container {{ $labels.name }} CPU usage is above 80% for more than 2 minutes."

      - alert: HighContainerMemoryUsage
        expr: container_memory_usage_bytes / 1024 / 1024 > 2000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High memory usage on container {{ $labels.name }}"
          description: "Container {{ $labels.name }} is using more than 2 GB of memory for 5 minutes."
