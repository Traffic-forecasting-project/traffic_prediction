global:
  scrape_interval: 5s  # Fréquence de collecte (5 secondes)

# rule_files:
#   - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: 'fastapi_api'
    scrape_interval: 3s
    metrics_path: /prometheus      # <-- IMPORTANT: matches FastAPI Instrumentator path
    static_configs:
      - targets: ['api:8000']      # 'api' = service name from docker-compose